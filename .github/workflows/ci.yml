name: CI

# `master` entra no gatilho de push porque o gate mais estrito do projeto estava
# fora do caminho que se usa: o commit de congelamento do PASSO 1 foi push direto
# no master e não rodou UMA execução de CI. Gate correto que não roda onde o
# código chega não protege nada.
on:
  pull_request:
    branches: [master]
  push:
    branches:
      - master
      - "codex/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Instalar dependências do worker
        run: npm ci --prefix worker

      - name: Testes
        run: npm test -- --run

      - name: Lint
        run: npm run lint

      - name: Typecheck do worker
        run: npm run typecheck --prefix worker

      - name: Build de produção
        run: npm run build

      - name: Gate da Engine V2 (pré-canário ou release certificada)
        working-directory: worker
        run: npx tsx scripts/v2-verificar-release.ts --pre-canary
